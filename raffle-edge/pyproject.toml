[project]
name = "raffle-edge"
version = "0.1.0"
description = "Research platform for UK online prize competitions: evidence-labelled registry, polite collection, immutable history."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[project.optional-dependencies]
analysis = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "statsmodels>=0.14"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[project.scripts]
raffle-edge = "raffle_edge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raffle_edge = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
